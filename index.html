<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>English Practice</title>
  <style>
    html, body { background: #0b0d12 !important; color: #e8eaed; margin: 0; }
  </style>
  <link rel="stylesheet" href="styles-srs.css?v=33" />
  <script>
    (function () {
      try {
        var st = JSON.parse(localStorage.getItem("english-practice-v1") || "{}");
        var t = st.themeUserSet ? (st.theme || "dark") : "dark";
        if (!st.themeUserSet) { st.theme = "dark"; localStorage.setItem("english-practice-v1", JSON.stringify(st)); }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
</head>
<body>
  <div id="boot" style="padding:24px;font-family:system-ui;text-align:center;background:#0b0d12;color:#e8eaed">Загрузка…</div>
  <script>
  (async function () {
    var CDN = "https://cdn.jsdelivr.net/gh/smert-s-games/english@2174573a9e65754c73af3a39fd3ea23b534bce1b";
    try {
      var r = await fetch(CDN + "/index.html");
      var html = await r.text();
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, "text/html");
      doc.documentElement.setAttribute("data-theme", "dark");
      doc.querySelectorAll("script[src],link[href]").forEach(function (el) {
        var attr = el.tagName === "LINK" ? "href" : "src";
        var v = el.getAttribute(attr);
        if (!v || /^https?:|\/\//.test(v)) return;
        var local = /^(js\/config\.js|js\/auth\.js)/.test(v.replace(/^\.\//, ""));
        if (local) el.setAttribute(attr, v.replace(/^\.\//, "").split("?")[0] + "?v=23");
        else el.setAttribute(attr, CDN + "/" + v.replace(/^\.\//, ""));
      });
      doc.querySelectorAll('script[src*="app.js"]').forEach(function (el) { el.remove(); });
      var headExtra = doc.createElement("link");
      headExtra.rel = "stylesheet";
      headExtra.href = "styles-srs.css?v=33";
      doc.head.appendChild(headExtra);
      var anti = doc.createElement("style");
      anti.textContent = "html,body{background:#0b0d12}html[data-theme=light],html[data-theme=light] body{background:var(--bg, #f5f5f7)}";
      doc.head.insertBefore(anti, doc.head.firstChild);
      var actions = doc.querySelector(".fc-actions");
      if (actions) {
        actions.className = "fc-actions fc-srs-actions";
        actions.innerHTML =
          '<button type="button" class="btn btn-srs again" id="fc-again">Снова</button>' +
          '<button type="button" class="btn btn-srs hard" id="fc-hard">Трудно</button>' +
          '<button type="button" class="btn btn-srs good" id="fc-good">Хорошо</button>' +
          '<button type="button" class="btn btn-srs easy" id="fc-easy">Легко</button>' +
          '<button type="button" id="fc-know" class="hidden" aria-hidden="true" tabindex="-1">know</button>';
      }
      var stats = doc.querySelector(".stats-row");
      if (stats && !doc.getElementById("due-today-block")) {
        var due = doc.createElement("div");
        due.className = "due-today-block";
        due.id = "due-today-block";
        due.innerHTML =
          '<div class="due-today-text">Сегодня к повторению: <strong id="due-today-count">0</strong> слов</div>' +
          '<button type="button" class="btn btn-primary" id="due-today-start">Начать повторение</button>';
        stats.insertAdjacentElement("afterend", due);
      }
      var progCards = doc.querySelector("#view-progress .progress-cards");
      if (progCards && !doc.getElementById("activity-heatmap-card")) {
        var hm = doc.createElement("div");
        hm.className = "progress-card heatmap-card";
        hm.id = "activity-heatmap-card";
        hm.innerHTML = "<h3>Активность (12 недель)</h3><div id=\"activity-heatmap\"></div>";
        progCards.appendChild(hm);
      }
      document.open();
      document.write("<!DOCTYPE html>" + doc.documentElement.outerHTML);
      document.close();
      try {
        var st2 = JSON.parse(localStorage.getItem("english-practice-v1") || "{}");
        var theme = st2.themeUserSet ? (st2.theme || "dark") : "dark";
        if (!st2.themeUserSet) { st2.theme = "dark"; localStorage.setItem("english-practice-v1", JSON.stringify(st2)); }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e2) { document.documentElement.setAttribute("data-theme", "dark"); }
      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src; s.onload = resolve; s.onerror = reject;
          document.body.appendChild(s);
        });
      }
      setTimeout(function () {
        loadScript("js/srs.js?v=31")
          .then(function () { return loadScript("app.js?v=31"); })
          .then(function () { return loadScript("js/quiz-keys.js?v=23"); })
          .then(function () { return loadScript("js/srs-hooks.js?v=33"); })
          .then(function () { return loadScript("js/heatmap.js?v=23"); })
          .then(function () { return loadScript("js/notes.js?v=28"); })
          .then(function () { return loadScript("js/due-session.js?v=30"); })
          .then(function () { return loadScript("js/daily-limit.js?v=31"); })
          .then(function () { return loadScript("js/stats.js?v=32"); })
          .catch(function (e) {
            console.error(e);
            var boot = document.getElementById("boot");
            if (boot) boot.textContent = "Ошибка скриптов: " + e;
          });
      }, 300);
    } catch (e) {
      document.getElementById("boot").textContent = "Ошибка: " + e;
    }
  })();
  </script>
</body>
</html>
